[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelpipe-encoder"
version = "0.1.0"
description = "A friendly Windows desktop video encoder"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8,<7",
  "psutil>=6,<8",
]

[project.scripts]
pixelpipe = "pixelpipe.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

